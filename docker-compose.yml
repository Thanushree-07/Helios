services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://helios:helios_dev_password@postgres:5432/helios
    env_file:
      - .env
    depends_on:
      - redis
      - postgres

  frontend:
    build: ./helios-ui
    ports:
      - "5173:80"
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=helios
      - POSTGRES_PASSWORD=helios_dev_password
      - POSTGRES_DB=helios
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: